data:
  train_dir: "models/data/REFUGE/train"
  val_dir: "models/data/REFUGE/val"
  image_size: 224
  batch_size: 16
  num_workers: 2

model:
  architecture: "resnet50"
  num_classes: 2
  pretrained: true
  checkpoint_path: "models/outputs/checkpoints/resnet50_best.pth"

training:
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.0001
  class_weights: [1.0, 9.0]  # Handles 1:9 REFUGE imbalance (Non-Glaucoma vs Glaucoma)

explainability:
  output_dir: "models/outputs/heatmaps"
  ig_steps: 50
  lime_segments: 100
  lime_samples: 500
  lime_batch_size: 32
